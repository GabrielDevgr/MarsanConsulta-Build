name: Build Marsan Print Agent
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'print-agent/**'
      - '.github/workflows/build-print-agent.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Windows x64
        run: dotnet publish print-agent/MarsanPrintAgent/MarsanPrintAgent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
      - uses: actions/upload-artifact@v4
        with:
          name: MarsanPrintAgent-Windows-x64
          path: print-agent/MarsanPrintAgent/bin/Release/net8.0-windows/win-x64/publish/MarsanPrintAgent.exe
