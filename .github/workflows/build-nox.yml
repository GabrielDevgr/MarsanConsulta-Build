name: Build MARSAN Assistant
on:
  workflow_dispatch:
  push:
    branches: [ nox-marsan-assistant ]
    paths:
      - 'nox/**'
      - '.github/workflows/build-nox.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Prepare MARSAN application icon
        shell: pwsh
        run: |
          $b64 = Get-Content "nox/NoxMarsanAssistant/marsan-icon.b64" -Raw
          [IO.File]::WriteAllBytes("nox/NoxMarsanAssistant/marsan.ico", [Convert]::FromBase64String($b64.Trim()))
          Write-Host "marsan.ico generated:" (Get-Item "nox/NoxMarsanAssistant/marsan.ico").Length "bytes"
      - name: Run voice interpretation tests
        run: dotnet run --project nox/NoxMarsanAssistant.Tests/NoxMarsanAssistant.Tests.csproj -c Release
      - name: Publish MARSAN Windows x64
        run: dotnet publish nox/NoxMarsanAssistant/NoxMarsanAssistant.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
      - name: Inject Explorer icon resource into final EXE
        shell: pwsh
        run: |
          $exe = (Resolve-Path "nox/NoxMarsanAssistant/bin/Release/net8.0-windows/win-x64/publish/NoxMarsanAssistant.exe").Path
          $ico = (Resolve-Path "nox/NoxMarsanAssistant/marsan.ico").Path

          Add-Type -TypeDefinition @"
          using System;
          using System.IO;
          using System.Runtime.InteropServices;
          using System.Collections.Generic;

          public static class IconInjector
          {
              [DllImport("kernel32.dll", SetLastError=true, CharSet=CharSet.Unicode)]
              static extern IntPtr BeginUpdateResource(string pFileName, bool bDeleteExistingResources);

              [DllImport("kernel32.dll", SetLastError=true)]
              static extern bool UpdateResource(
                  IntPtr hUpdate,
                  IntPtr lpType,
                  IntPtr lpName,
                  ushort wLanguage,
                  byte[] lpData,
                  uint cbData);

              [DllImport("kernel32.dll", SetLastError=true)]
              static extern bool EndUpdateResource(IntPtr hUpdate, bool fDiscard);

              static IntPtr Id(int value) => new IntPtr(value);

              public static void Inject(string exePath, string icoPath)
              {
                  byte[] ico = File.ReadAllBytes(icoPath);
                  ushort reserved = BitConverter.ToUInt16(ico, 0);
                  ushort type = BitConverter.ToUInt16(ico, 2);
                  ushort count = BitConverter.ToUInt16(ico, 4);

                  if (reserved != 0 || type != 1 || count < 1)
                      throw new InvalidDataException("Arquivo ICO inválido.");

                  IntPtr h = BeginUpdateResource(exePath, false);
                  if (h == IntPtr.Zero)
                      throw new System.ComponentModel.Win32Exception(Marshal.GetLastWin32Error());

                  try
                  {
                      using var group = new MemoryStream();
                      using var bw = new BinaryWriter(group);
                      bw.Write((ushort)0);
                      bw.Write((ushort)1);
                      bw.Write(count);

                      for (int i = 0; i < count; i++)
                      {
                          int entry = 6 + i * 16;
                          byte width = ico[entry + 0];
                          byte height = ico[entry + 1];
                          byte colorCount = ico[entry + 2];
                          byte res = ico[entry + 3];
                          ushort planes = BitConverter.ToUInt16(ico, entry + 4);
                          ushort bitCount = BitConverter.ToUInt16(ico, entry + 6);
                          uint bytesInRes = BitConverter.ToUInt32(ico, entry + 8);
                          uint imageOffset = BitConverter.ToUInt32(ico, entry + 12);

                          byte[] image = new byte[bytesInRes];
                          Buffer.BlockCopy(ico, (int)imageOffset, image, 0, (int)bytesInRes);

                          int resourceId = 101 + i;
                          if (!UpdateResource(h, Id(3), Id(resourceId), 0, image, (uint)image.Length))
                              throw new System.ComponentModel.Win32Exception(Marshal.GetLastWin32Error());

                          bw.Write(width);
                          bw.Write(height);
                          bw.Write(colorCount);
                          bw.Write(res);
                          bw.Write(planes);
                          bw.Write(bitCount);
                          bw.Write(bytesInRes);
                          bw.Write((ushort)resourceId);
                      }

                      byte[] groupData = group.ToArray();
                      if (!UpdateResource(h, Id(14), Id(1), 0, groupData, (uint)groupData.Length))
                          throw new System.ComponentModel.Win32Exception(Marshal.GetLastWin32Error());

                      if (!EndUpdateResource(h, false))
                          throw new System.ComponentModel.Win32Exception(Marshal.GetLastWin32Error());

                      h = IntPtr.Zero;
                  }
                  finally
                  {
                      if (h != IntPtr.Zero)
                          EndUpdateResource(h, true);
                  }
              }
          }
          "@

          [IconInjector]::Inject($exe, $ico)
          Write-Host "RT_GROUP_ICON injected into final EXE."
      - uses: actions/upload-artifact@v4
        with:
          name: MARSAN-Assistant-Windows-x64
          path: nox/NoxMarsanAssistant/bin/Release/net8.0-windows/win-x64/publish/NoxMarsanAssistant.exe
