name: Build MARSAN Assistant
on:
  workflow_dispatch:
  push:
    branches: [ nox-marsan-assistant ]
    paths:
      - 'nox/**'
      - '.github/workflows/build-nox.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Prepare MARSAN application icon
        shell: pwsh
        run: |
          $b64 = Get-Content "nox/NoxMarsanAssistant/marsan-icon.b64" -Raw
          [IO.File]::WriteAllBytes("nox/NoxMarsanAssistant/marsan.ico", [Convert]::FromBase64String($b64.Trim()))
          Write-Host "marsan.ico generated:" (Get-Item "nox/NoxMarsanAssistant/marsan.ico").Length "bytes"
      - name: Run voice interpretation tests
        run: dotnet run --project nox/NoxMarsanAssistant.Tests/NoxMarsanAssistant.Tests.csproj -c Release
      - name: Publish MARSAN Windows x64
        run: dotnet publish nox/NoxMarsanAssistant/NoxMarsanAssistant.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
      - uses: actions/upload-artifact@v4
        with:
          name: MARSAN-Assistant-Windows-x64
          path: nox/NoxMarsanAssistant/bin/Release/net8.0-windows/win-x64/publish/NoxMarsanAssistant.exe
