name: Build NOX Marsan Assistant
on:
  workflow_dispatch:
  push:
    branches: [ nox-marsan-assistant ]
    paths:
      - 'nox/**'
      - '.github/workflows/build-nox.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish NOX Windows x64
        run: dotnet publish nox/NoxMarsanAssistant/NoxMarsanAssistant.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
      - uses: actions/upload-artifact@v4
        with:
          name: NOX-Marsan-Assistant-Windows-x64
          path: nox/NoxMarsanAssistant/bin/Release/net8.0-windows/win-x64/publish/NoxMarsanAssistant.exe
