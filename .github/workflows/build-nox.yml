name: Build MARSAN Assistant
# v0.12.6: build refreshed after financial balance fix
on:
  workflow_dispatch:
  push:
    branches: [ nox-marsan-assistant, marsan-assistant-ui-refresh ]
    paths:
      - 'nox/**'
      - '.github/workflows/build-nox.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run voice interpretation tests
        run: dotnet run --project nox/NoxMarsanAssistant.Tests/NoxMarsanAssistant.Tests.csproj -c Release
      - name: Publish MARSAN Windows x64
        run: dotnet publish nox/NoxMarsanAssistant/NoxMarsanAssistant.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
      - uses: actions/upload-artifact@v4
        with:
          name: MARSAN-GROK-ASSISTANT-Windows-x64
          path: nox/NoxMarsanAssistant/bin/Release/net8.0-windows/win-x64/publish/MarsanGrokAssistant.exe

      - name: Pack complete project source
        shell: pwsh
        run: |
          $files = @("nox", "print-agent", "app", ".github", "README.md", "build.gradle", "gradle.properties", "settings.gradle", "TRIGGER.txt")
          Compress-Archive -Path $files -DestinationPath MARSAN-GROK-ASSISTANT-FONTE-COMPLETO.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: MARSAN-GROK-ASSISTANT-FONTE-COMPLETO
          path: MARSAN-GROK-ASSISTANT-FONTE-COMPLETO.zip
          retention-days: 90
