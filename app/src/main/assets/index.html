<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Marsan Consulta</title><style>:root{--g:#173d2d;--g2:#285c45;--p:#f4f1e8;--c:#fff;--l:#d9d5c8;--i:#1f2a24;--m:#6e766f;--a:#c7a86b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--p);color:var(--i)}.top{background:var(--g);color:#fff;padding:16px;border-bottom:3px solid var(--a);position:sticky;top:0;z-index:2}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:10px;background:#fff;color:var(--g);display:grid;place-items:center;font-weight:900;font-size:24px}.brand b{font-size:19px}.brand small{display:block;opacity:.8}.wrap{padding:14px;max-width:1200px;margin:auto}.status{font-size:12px;color:var(--m);margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.sheet{background:#fff;border:1px solid var(--l);border-radius:16px;padding:16px;text-align:left;min-height:116px}.sheet h2{font-size:17px;margin:7px 0}.balance{font-size:20px;font-weight:800;color:var(--g2)}.open{margin-top:12px;color:var(--g2);font-weight:700}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar button{min-height:44px;padding:0 14px;border:1px solid var(--l);border-radius:10px;background:#fff;font-weight:700}.toolbar .primary{background:var(--g2);color:#fff}.summary{display:grid;grid-template-columns:repeat(4,minmax(145px,1fr));gap:8px;margin-bottom:14px}.metric{background:#fff;border:1px solid var(--l);border-radius:12px;padding:12px}.metric span{display:block;color:var(--m);font-size:11px;font-weight:700}.metric strong{display:block;margin-top:5px;font-size:18px;white-space:nowrap}.tablebox{overflow:auto;border:1px solid var(--l);border-radius:12px;background:#fff}.tablebox table{border-collapse:collapse;width:100%;min-width:1000px;font-size:12px}.tablebox th{background:var(--g);color:#fff;padding:9px 8px;white-space:nowrap}.tablebox td{padding:7px 8px;border-bottom:1px solid #ece9e0;white-space:nowrap}.tablebox tr.acerto td{background:#dff2e6}.num{text-align:right}.obs{max-width:260px;white-space:normal!important}.empty,.loading{padding:50px 20px;text-align:center;color:var(--m)}@media(max-width:720px){.summary{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media print{.top,.toolbar,.status{display:none!important}.wrap{padding:0}.tablebox{overflow:visible}.tablebox table{min-width:0;font-size:9px}}</style></head><body><header class="top"><div class="brand"><div class="mark">M</div><div><b>Marsan Consulta</b><small>Controle de cargas e saldos</small></div></div></header><main class="wrap" id="root"><div class="loading">Atualizando planilhas…</div></main><script>(function(){var root=document.getElementById('root'),data=null,current=null;var money=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}),num=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]})}function rows(n){return (data&&data.movements||[]).filter(function(x){return x.conta===n})}function sum(r){return r.reduce(function(a,x){a.total+=Number(x.valorCarga||0);a.paid+=Number(x.valorPago||0);a.volume+=Number(x.volume||0);a.loads++;return a},{total:0,paid:0,volume:0,loads:0})}function date(v){if(!v)return '';var d=new Date(v+'T00:00:00Z');return isNaN(d)?esc(v):d.toLocaleDateString('pt-BR',{timeZone:'UTC'})}function updated(){try{return new Date(data.updatedAt).toLocaleString('pt-BR')}catch(e){return ''}}function home(){current=null;var names=[...new Set((data&&data.movements||[]).map(function(x){return x.conta}))];var html='<div class="status">Atualizado em '+esc(updated())+'</div><div class="grid">';names.forEach(function(n){var r=rows(n),s=sum(r),cat=r[0]&&r[0].categoria||'';html+='<button class="sheet" data-sheet="'+esc(n)+'"><small>'+(cat==='compra'?'COMPRA / FORNECEDOR':'VENDA / CLIENTE')+'</small><h2>'+esc(n.replace(/^VENDA\s+|^COMPRA\s+/i,''))+'</h2><div class="balance">'+money.format(Math.abs(s.total-s.paid))+'</div><div class="open">Visualizar →</div></button>'});if(data&&data.checks&&data.checks.length)html+='<button class="sheet" id="checks"><small>CONTROLE</small><h2>Cheques</h2><div class="balance">'+money.format(data.checks.reduce(function(s,x){return s+Number(x.valor||0)},0))+'</div><div class="open">Visualizar →</div></button>';root.innerHTML=html+'</div>';root.querySelectorAll('[data-sheet]').forEach(function(b){b.onclick=function(){sheet(b.getAttribute('data-sheet'))}});var c=document.getElementById('checks');if(c)c.onclick=checks}function toolbar(title,body,metrics){root.innerHTML='<div class="toolbar"><button id="back">← Voltar</button><button id="refresh">↻ Atualizar</button><button id="print" class="primary">🖨 Imprimir / PDF</button></div><h2>'+esc(title)+'</h2>'+metrics+body;document.getElementById('back').onclick=home;document.getElementById('refresh').onclick=load;document.getElementById('print').onclick=function(){if(window.MarsanAPI)window.MarsanAPI.printCurrentView()}}function sheet(n){current={type:'sheet',name:n};var r=rows(n),s=sum(r),body='<div class="tablebox"><table><thead><tr><th>DATA</th><th>TIPO</th><th>ROMANEIO</th><th>CARGA (m³)</th><th>VALOR (m³)</th><th>VALOR CARGA</th><th>VALOR PAGO</th><th>REF.</th><th>OBSERVAÇÃO</th></tr></thead><tbody>';r.forEach(function(x){body+='<tr class="'+(String(x.tipo||'').toUpperCase()==='ACERTO'?'acerto':'')+'"><td>'+date(x.data)+'</td><td>'+esc(x.tipo)+'</td><td>'+esc(x.romaneio)+'</td><td class="num">'+(x.volume?num.format(x.volume):'')+'</td><td class="num">'+(x.valorUnitario?money.format(x.valorUnitario):'')+'</td><td class="num">'+(x.valorCarga?money.format(x.valorCarga):'')+'</td><td class="num">'+(x.valorPago?money.format(x.valorPago):'')+'</td><td>'+esc(x.referencia)+'</td><td class="obs">'+esc(x.observacoes)+'</td></tr>'});body+='</tbody></table></div>';var m='<section class="summary"><div class="metric"><span>TOTAL DE CARGAS</span><strong>'+money.format(s.total)+'</strong></div><div class="metric"><span>TOTAL PAGO</span><strong>'+money.format(s.paid)+'</strong></div><div class="metric"><span>VOLUME</span><strong>'+num.format(s.volume)+' m³</strong></div><div class="metric"><span>SALDO ATUAL</span><strong>'+money.format(s.total-s.paid)+'</strong></div></section>';toolbar(n,body,m)}function checks(){current={type:'checks'};var r=data&&data.checks||[],body='<div class="tablebox"><table><thead><tr><th>BANCO</th><th>Nº CHEQUE</th><th>EMISSOR</th><th>VENCIMENTO</th><th>VALOR</th><th>STATUS</th><th>REPASSADO PARA</th><th>DATA REPASSE</th><th>OBSERVAÇÃO</th></tr></thead><tbody>';r.forEach(function(x){body+='<tr><td>'+esc(x.banco)+'</td><td>'+esc(x.numero)+'</td><td>'+esc(x.emissor||x.cliente)+'</td><td>'+date(x.vencimento)+'</td><td class="num">'+money.format(Number(x.valor||0))+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.repassadoPara)+'</td><td>'+date(x.dataRepasse)+'</td><td class="obs">'+esc(x.observacoes)+'</td></tr>'});body+='</tbody></table></div>';toolbar('CHEQUES',body,'')}function load(){root.innerHTML='<div class="loading">Atualizando planilhas…</div>';if(window.MarsanAPI)window.MarsanAPI.loadData()}window.Marsan={receiveData:function(raw){try{data=JSON.parse(raw);if(current&&current.type==='sheet')sheet(current.name);else if(current&&current.type==='checks')checks();else home()}catch(e){this.receiveError('Os dados recebidos não puderam ser interpretados.')}},receiveError:function(msg){root.innerHTML='<div class="empty">'+esc(msg)+'<br><br><button id="retry">Tentar novamente</button></div>';document.getElementById('retry').onclick=load},goBack:function(){if(current){home();return true}return false}};load()})();</script></body></html>
