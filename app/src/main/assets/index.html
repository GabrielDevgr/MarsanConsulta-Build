<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Marsan Consulta</title>
<style>
:root{--g:#173d2d;--g2:#285c45;--p:#f4f1e8;--c:#fff;--l:#d9d5c8;--i:#1f2a24;--m:#6e766f;--a:#c7a86b;--blue:#123e75;--green:#2c7a1f;--brown:#4d3d25;--beige:#e6d5b0;--acerto:#dfeeda}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:Arial,sans-serif;background:var(--p);color:var(--i)}
.top{background:var(--g);color:#fff;padding:16px;border-bottom:3px solid var(--a);position:sticky;top:0;z-index:2}.brand{display:flex;align-items:center;gap:12px}.mark{width:42px;height:42px;border-radius:10px;background:#fff;color:var(--g);display:grid;place-items:center;font-weight:900;font-size:24px}.brand b{font-size:19px}.brand small{display:block;opacity:.8}
.wrap{padding:14px;max-width:1200px;margin:auto}.status{font-size:12px;color:var(--m);margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.sheet{background:#fff;border:1px solid var(--l);border-radius:16px;padding:16px;text-align:left;min-height:116px}.sheet h2{font-size:17px;margin:7px 0}.balance{font-size:20px;font-weight:800;color:var(--g2)}.open{margin-top:12px;color:var(--g2);font-weight:700}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar button{min-height:44px;padding:0 14px;border:1px solid var(--l);border-radius:10px;background:#fff;font-weight:700}.toolbar .primary{background:var(--g2);color:#fff}.screen-title{margin:0 0 10px}.summary{display:grid;grid-template-columns:repeat(4,minmax(145px,1fr));gap:8px;margin-bottom:14px}.metric{background:#fff;border:1px solid var(--l);border-radius:12px;padding:12px}.metric span{display:block;color:var(--m);font-size:11px;font-weight:700}.metric strong{display:block;margin-top:5px;font-size:18px;white-space:nowrap}
.print-header,.print-summary{display:none}.tablebox{overflow:auto;border:1px solid var(--l);border-radius:12px;background:#fff}.tablebox table{border-collapse:collapse;width:100%;min-width:1000px;font-size:12px}.tablebox th{background:var(--g);color:#fff;padding:9px 8px;white-space:nowrap}.tablebox td{padding:7px 8px;border-bottom:1px solid #ece9e0;white-space:nowrap}.tablebox tr.acerto td{background:#dff2e6}.tablebox td.tipo-madeira{background:var(--brown);color:#fff}.tablebox td.tipo-refile{background:var(--beige);color:#222}.tablebox tr.acerto td.tipo-acerto{background:var(--acerto);color:#1c5b25}.num{text-align:right}.obs{max-width:260px;white-space:normal!important}.empty,.loading{padding:50px 20px;text-align:center;color:var(--m)}
@media(max-width:720px){.summary{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
@page{size:A4 landscape;margin:4.5mm}
@media print{
  html,body{width:auto!important;height:auto!important;min-height:0!important;margin:0!important;padding:0!important;overflow:hidden!important;background:#fff!important;color:#111!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .top,.toolbar,.status,.screen-title,.summary{display:none!important}.wrap{padding:0!important;margin:0!important;max-width:none!important;width:100%!important;height:auto!important;min-height:0!important;overflow:hidden!important;page-break-after:avoid!important;break-after:avoid-page!important}
  .print-header{display:block!important;background:var(--blue)!important;color:#fff!important;text-align:center!important;font-size:13.5px!important;line-height:1!important;font-weight:800!important;padding:3.1mm 2mm 2.7mm!important;margin:0 0 1.8mm!important;letter-spacing:.1px}
  .print-summary{display:grid!important;grid-template-columns:1fr 1fr 1fr 1fr 1.15fr!important;gap:0!important;margin:0 0 2.1mm!important;border:0!important;width:100%!important}
  .print-summary .pmetric{min-height:15.5mm!important;padding:2.1mm 1mm 1.5mm!important;text-align:center!important;border-right:.25mm solid #c8c8c8!important;background:#d6d6d6!important}
  .print-summary .pmetric:last-child{border-right:0!important;background:#b7e3cf!important}.print-summary .plabel{display:block!important;font-size:8.1px!important;line-height:1.05!important;margin-bottom:2.2mm!important;white-space:nowrap!important}.print-summary .pvalue{display:block!important;font-size:10.7px!important;line-height:1!important;font-weight:800!important;white-space:nowrap!important}.print-summary .pmetric:last-child .plabel,.print-summary .pmetric:last-child .pvalue{color:#0b4e2c!important}
  .tablebox{overflow:hidden!important;border:0!important;border-radius:0!important;background:#fff!important;width:100%!important;height:auto!important;min-height:0!important;page-break-after:avoid!important;break-after:avoid-page!important}.tablebox table{width:100%!important;min-width:0!important;table-layout:fixed!important;border-collapse:collapse!important;font-size:10pt!important;line-height:1.05!important}
  .tablebox thead{display:table-header-group!important}.tablebox tr{page-break-inside:avoid!important;break-inside:avoid!important}.tablebox th{background:var(--blue)!important;color:#fff!important;border:.18mm solid #bfc4c8!important;padding:1.25mm .65mm!important;font-size:9.5pt!important;line-height:1.05!important;white-space:normal!important;text-align:center!important;font-weight:800!important}.tablebox th:nth-child(7),.tablebox th:nth-child(8),.tablebox th:nth-child(9){background:#2f7d1f!important}
  .tablebox td{border:.16mm solid #c7c7c7!important;padding:.75mm .7mm!important;height:5mm!important;line-height:1.05!important;font-size:10pt!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;vertical-align:middle!important}.tablebox td.obs{white-space:nowrap!important;max-width:none!important}.tablebox td.num{text-align:right!important}.tablebox td.tipo-madeira{background:var(--brown)!important;color:#fff!important}.tablebox td.tipo-refile{background:var(--beige)!important;color:#222!important}.tablebox tr.acerto td{background:var(--acerto)!important;color:#184f20!important}.tablebox tr.acerto td.tipo-acerto{background:var(--acerto)!important;color:#184f20!important}
  .print-hide-old{display:none!important}
  .tablebox th:nth-child(1){width:8%}.tablebox th:nth-child(2){width:8%}.tablebox th:nth-child(3){width:9%}.tablebox th:nth-child(4){width:10%}.tablebox th:nth-child(5){width:10%}.tablebox th:nth-child(6){width:12%}.tablebox th:nth-child(7){width:14%}.tablebox th:nth-child(8){width:13%}.tablebox th:nth-child(9){width:16%}
}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="mark">M</div><div><b>Marsan Consulta</b><small>Controle de cargas e saldos</small></div></div></header>
<main class="wrap" id="root"><div class="loading">Atualizando planilhas…</div></main>
<script>
(function(){
var root=document.getElementById('root'),data=null,current=null;
var money=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}),num=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]})}
function rows(n){return (data&&data.movements||[]).filter(function(x){return x.conta===n})}
function cleanName(n){return String(n||'').replace(/^VENDA\s+|^COMPRA\s+/i,'').trim()}
function sum(r){return r.reduce(function(a,x){var t=String(x.tipo||'').toUpperCase();a.total+=Number(x.valorCarga||0);a.paid+=Number(x.valorPago||0);a.volume+=Number(x.volume||0);if(t==='MADEIRA')a.madeira+=Number(x.volume||0);if(t==='REFILE')a.refile+=Number(x.volume||0);a.loads++;return a},{total:0,paid:0,volume:0,madeira:0,refile:0,loads:0})}
function date(v){if(!v)return '';var d=new Date(v+'T00:00:00Z');return isNaN(d)?esc(v):d.toLocaleDateString('pt-BR',{timeZone:'UTC'})}
function updated(){try{return new Date(data.updatedAt).toLocaleString('pt-BR')}catch(e){return ''}}
function home(){current=null;var names=[...new Set((data&&data.movements||[]).map(function(x){return x.conta}))];var html='<div class="status">Atualizado em '+esc(updated())+'</div><div class="grid">';names.forEach(function(n){var r=rows(n),s=sum(r),cat=r[0]&&r[0].categoria||'';html+='<button class="sheet" data-sheet="'+esc(n)+'"><small>'+(cat==='compra'?'COMPRA / FORNECEDOR':'VENDA / CLIENTE')+'</small><h2>'+esc(cleanName(n))+'</h2><div class="balance">'+money.format(Math.abs(s.total-s.paid))+'</div><div class="open">Visualizar →</div></button>'});if(data&&data.checks&&data.checks.length)html+='<button class="sheet" id="checks"><small>CONTROLE</small><h2>Cheques</h2><div class="balance">'+money.format(data.checks.reduce(function(s,x){return s+Number(x.valor||0)},0))+'</div><div class="open">Visualizar →</div></button>';root.innerHTML=html+'</div>';root.querySelectorAll('[data-sheet]').forEach(function(b){b.onclick=function(){sheet(b.getAttribute('data-sheet'))}});var c=document.getElementById('checks');if(c)c.onclick=checks}
function toolbar(title,body,metrics,printHeader,printSummary){root.innerHTML='<div class="toolbar"><button id="back">← Voltar</button><button id="refresh">↻ Atualizar</button><button id="print" class="primary">🖨 Imprimir / PDF</button></div><h2 class="screen-title">'+esc(title)+'</h2>'+(printHeader||'')+(printSummary||'')+metrics+body;document.getElementById('back').onclick=home;document.getElementById('refresh').onclick=load;document.getElementById('print').onclick=function(){if(window.MarsanAPI)window.MarsanAPI.printCurrentView()}}
function typeClass(t){t=String(t||'').toUpperCase();if(t==='MADEIRA')return'tipo-madeira';if(t==='REFILE')return'tipo-refile';if(t==='ACERTO')return'tipo-acerto';return''}
function sheet(n){current={type:'sheet',name:n};var r=rows(n),s=sum(r),client=cleanName(n),paidLabel='VALOR PAGO'+(client?' '+client:'');var body='<div class="tablebox"><table><thead><tr><th>DATA</th><th>TIPO</th><th>Nº ROMANEIO</th><th>CARGA (m³)</th><th>VALOR (m³)</th><th>VALOR CARGA</th><th>'+esc(paidLabel)+'</th><th>Nº CHEQUE / REF</th><th>OBSERVAÇÃO</th></tr></thead><tbody>';var printStart=Math.max(0,r.length-28);r.forEach(function(x,idx){var t=String(x.tipo||'').toUpperCase(),rowClass=(t==='ACERTO'?'acerto ':'')+(idx<printStart?'print-hide-old':'');body+='<tr class="'+rowClass.trim()+'"><td>'+date(x.data)+'</td><td class="'+typeClass(t)+'">'+esc(x.tipo)+'</td><td>'+esc(x.romaneio)+'</td><td class="num">'+(x.volume?num.format(x.volume):'')+'</td><td class="num">'+(x.valorUnitario?money.format(x.valorUnitario):'')+'</td><td class="num">'+(x.valorCarga?money.format(x.valorCarga):'')+'</td><td class="num">'+(x.valorPago?money.format(x.valorPago):'')+'</td><td>'+esc(x.referencia)+'</td><td class="obs">'+esc(x.observacoes)+'</td></tr>'});body+='</tbody></table></div>';
var m='<section class="summary"><div class="metric"><span>TOTAL DE CARGAS</span><strong>'+money.format(s.total)+'</strong></div><div class="metric"><span>TOTAL PAGO</span><strong>'+money.format(s.paid)+'</strong></div><div class="metric"><span>VOLUME</span><strong>'+num.format(s.volume)+' m³</strong></div><div class="metric"><span>SALDO ATUAL</span><strong>'+money.format(s.total-s.paid)+'</strong></div></section>';
var ph='<div class="print-header">CONTROLE DE CARGAS E SALDO '+esc(client.toUpperCase())+'</div>';
var ps='<section class="print-summary"><div class="pmetric"><span class="plabel">📦 TOTAL CARGAS (R$)</span><span class="pvalue">'+money.format(s.total)+'</span></div><div class="pmetric"><span class="plabel">💵 TOTAL PAGO (R$)</span><span class="pvalue">'+money.format(s.paid)+'</span></div><div class="pmetric"><span class="plabel">📊 TOTAL MADEIRA M³</span><span class="pvalue">'+num.format(s.madeira)+' m³</span></div><div class="pmetric"><span class="plabel">🌲 TOTAL REFILE M³</span><span class="pvalue">'+num.format(s.refile)+' m³</span></div><div class="pmetric"><span class="plabel">💲 SALDO ATUAL</span><span class="pvalue">'+money.format(s.total-s.paid)+'</span></div></section>';
toolbar(n,body,m,ph,ps)}
function checks(){current={type:'checks'};var r=data&&data.checks||[],body='<div class="tablebox"><table><thead><tr><th>BANCO</th><th>Nº CHEQUE</th><th>EMISSOR</th><th>VENCIMENTO</th><th>VALOR</th><th>STATUS</th><th>REPASSADO PARA</th><th>DATA REPASSE</th><th>OBSERVAÇÃO</th></tr></thead><tbody>';r.forEach(function(x){body+='<tr><td>'+esc(x.banco)+'</td><td>'+esc(x.numero)+'</td><td>'+esc(x.emissor||x.cliente)+'</td><td>'+date(x.vencimento)+'</td><td class="num">'+money.format(Number(x.valor||0))+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.repassadoPara)+'</td><td>'+date(x.dataRepasse)+'</td><td class="obs">'+esc(x.observacoes)+'</td></tr>'});body+='</tbody></table></div>';toolbar('CHEQUES',body,'','','')}
function load(){root.innerHTML='<div class="loading">Atualizando planilhas…</div>';if(window.MarsanAPI)window.MarsanAPI.loadData()}
window.Marsan={receiveData:function(raw){try{data=JSON.parse(raw);if(current&&current.type==='sheet')sheet(current.name);else if(current&&current.type==='checks')checks();else home()}catch(e){this.receiveError('Os dados recebidos não puderam ser interpretados.')}},receiveError:function(msg){root.innerHTML='<div class="empty">'+esc(msg)+'<br><br><button id="retry">Tentar novamente</button></div>';document.getElementById('retry').onclick=load},goBack:function(){if(current){home();return true}return false}};load()
})();
</script>
</body>
</html>
